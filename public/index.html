<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="pi-web-token" content="__PI_WEB_TOKEN__" />
		<meta name="color-scheme" content="light dark" />
		<title>pi</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<script src="/js/theme-init.js"></script>
		<link rel="stylesheet" href="/vendor/katex/katex.min.css" />
		<link rel="stylesheet" href="/css/app.css" />
		<script src="/vendor/markdown-it/markdown-it.min.js"></script>
		<script src="/vendor/katex/katex.min.js"></script>
		<script src="/vendor/dompurify/purify.min.js"></script>
		<script src="/vendor/hljs/highlight.min.js"></script>
		<script type="module" src="/js/app.js"></script>
	</head>
	<body>
		<div id="app" class="app">
			<aside class="sidebar" aria-label="Sessions">
				<div class="sidebar-head">
					<a class="brand" href="#/" title="Home"><span class="brand-logo">π</span><span>pi</span></a>
					<button id="btn-theme" class="icon-btn" type="button"></button>
				</div>
				<div class="sidebar-actions">
					<button id="btn-new" class="btn primary block" type="button"></button>
				</div>
				<div class="sidebar-search">
					<input id="search" type="search" placeholder="Search sessions   Ctrl+K" autocomplete="off" dir="auto" />
				</div>
				<nav id="session-list" class="session-list"></nav>
				<div class="sidebar-foot">
					<button id="toggle-subagents" class="foot-toggle" type="button" title="Show subagent sessions in the list"></button>
				</div>
			</aside>
			<div id="scrim" class="scrim"></div>
			<main class="main">
				<header class="topbar">
					<button id="btn-sidebar" class="icon-btn" type="button" title="Toggle sidebar"></button>
					<div id="topbar-main" class="topbar-main"></div>
					<div id="topbar-side" class="topbar-side"></div>
				</header>
				<div id="offline" class="offline" hidden>Reconnecting to pi-web…</div>
				<div id="scroller" class="scroller">
					<div id="conversation" class="conversation"></div>
				</div>
				<button id="jump" class="jump" type="button" hidden></button>
				<footer class="composer-wrap">
					<div id="dock-above" class="dock"></div>
					<div id="composer" class="composer">
						<div id="slash-menu" class="slash-menu" hidden></div>
						<div id="attachments" class="attachments" hidden></div>
						<div class="composer-row">
							<button id="btn-attach" class="icon-btn" type="button" title="Attach files: images go into the chat, other files' paths land in the box"></button>
							<textarea id="input" rows="1" dir="auto" autocomplete="off" spellcheck="true"></textarea>
							<button id="btn-stop" class="btn stop" type="button" hidden></button>
							<button id="btn-send" class="send-btn" type="button"></button>
						</div>
						<input id="file-input" type="file" multiple hidden />
					</div>
					<div id="dock-below" class="dock"></div>
					<div class="statusbar">
						<div id="status-meters" class="status-meters"></div>
						<div id="composer-hint" class="composer-hint"></div>
					</div>
				</footer>
			</main>
			<aside id="side" class="side-panel" aria-label="Subagent" hidden></aside>
		</div>
		<div id="modal-root"></div>
		<div id="toasts" class="toasts" aria-live="polite"></div>
		<div id="lightbox" class="lightbox" hidden></div>
	</body>
</html>
